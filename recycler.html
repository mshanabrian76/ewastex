<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>E-WasteX | Recycler Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f8f5;
            color: #173b2a;
        }

        /* NAVBAR */

        .navbar {
            background: #0b3d2e;
            color: white;
            padding: 18px 40px;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .nav-links {
            display: flex;
            gap: 10px;
        }

        .nav-btn {
            color: white;
            text-decoration: none;

            border: 1px solid #ffffff55;

            padding: 9px 16px;

            border-radius: 8px;
        }

        .nav-btn:hover {
            background: #ffffff15;
        }

        /* MAIN */

        .container {
            width: 90%;
            max-width: 1200px;
            margin: 40px auto;
        }

        .page-title {
            margin-bottom: 30px;
        }

        .page-title h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .page-title p {
            color: #68756e;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;

            margin-bottom: 30px;
        }

        .stat-card {
            background: white;

            padding: 25px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        .stat-card span {
            color: #718078;
            font-size: 14px;
        }

        .stat-card h2 {
            font-size: 28px;
            margin-top: 8px;
        }

        /* MESSAGE */

        .message {
            display: none;

            background: #e5f7ed;
            color: #16834b;

            padding: 15px 20px;

            border-radius: 10px;

            margin-bottom: 20px;

            font-weight: bold;
        }

        /* DEVICE */

        .device-card {
            background: white;

            padding: 30px;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        .device-header {
            display: flex;

            justify-content: space-between;

            align-items: center;

            margin-bottom: 25px;
        }

        .device-header h2 {
            margin-bottom: 6px;
        }

        .tracking-id {
            color: #718078;
            font-size: 14px;
        }

        .status {
            background: #eee9ff;

            color: #6847d9;

            padding: 10px 18px;

            border-radius: 30px;

            font-weight: bold;
        }

        /* INFORMATION */

        .info-grid {
            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            gap: 15px;

            margin-bottom: 30px;
        }

        .info-box {
            background: #f6f9f7;

            padding: 18px;

            border-radius: 10px;
        }

        .info-box span {
            display: block;

            color: #718078;

            font-size: 13px;

            margin-bottom: 7px;
        }

        .info-box strong {
            font-size: 16px;
        }

        /* PROCESS */

        .process-title {
            margin-bottom: 15px;
        }

        .process-box {
            background: #f6f9f7;

            padding: 25px;

            border-radius: 12px;

            margin-bottom: 25px;
        }

        .process-step {
            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 18px;
        }

        .process-step:last-child {
            margin-bottom: 0;
        }

        .step-circle {
            width: 32px;
            height: 32px;

            border-radius: 50%;

            background: #dce5df;

            display: flex;

            align-items: center;

            justify-content: center;

            font-weight: bold;

            flex-shrink: 0;
        }

        .step-complete .step-circle {
            background: #16834b;
            color: white;
        }

        .step-current .step-circle {
            background: #7a5cff;
            color: white;
        }

        .step-text strong {
            display: block;
            margin-bottom: 3px;
        }

        .step-text span {
            color: #718078;
            font-size: 13px;
        }

        /* ACTIONS */

        .actions {
            display: flex;

            gap: 12px;

            flex-wrap: wrap;
        }

        button {
            border: none;

            cursor: pointer;

            padding: 13px 20px;

            border-radius: 8px;

            font-size: 15px;

            font-weight: bold;
        }

        .processing-btn {
            background: #7a5cff;
            color: white;
        }

        .recycle-btn {
            background: #16834b;
            color: white;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            background: #cbd5cf;

            color: #68756e;

            cursor: not-allowed;
        }

        /* REWARD */

        .reward {
            margin-top: 25px;

            background: #0b3d2e;

            color: white;

            padding: 25px;

            border-radius: 15px;

            display: flex;

            justify-content: space-between;

            align-items: center;
        }

        .reward p {
            color: #c9ddd4;

            margin-top: 5px;
        }

        .points {
            font-size: 30px;
            font-weight: bold;
        }

        /* EMPTY */

        .empty {
            background: white;

            padding: 60px 30px;

            text-align: center;

            border-radius: 15px;

            box-shadow:
                0 5px 20px rgba(0,0,0,0.06);
        }

        .empty h2 {
            margin-bottom: 10px;
        }

        .empty p {
            color: #68756e;
            margin-bottom: 20px;
        }

        .empty a {
            display: inline-block;

            background: #16834b;

            color: white;

            text-decoration: none;

            padding: 12px 20px;

            border-radius: 8px;
        }

        /* MOBILE */

        @media (max-width: 750px) {

            .navbar {
                padding: 15px 20px;
            }

            .container {
                width: 92%;
                margin: 25px auto;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .info-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .device-header {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

            .reward {
                flex-direction: column;

                align-items: flex-start;

                gap: 15px;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            E-WasteX
        </div>

        <div class="nav-links">

            <a href="dashboard.html"
               class="nav-btn">
                Dashboard
            </a>

            <a href="track.html"
               class="nav-btn">
                Track Device
            </a>

        </div>

    </nav>


    <!-- MAIN -->

    <main class="container">


        <div class="page-title">

            <h1>
                Certified Recycler
            </h1>

            <p>
                Process electronic waste responsibly and record the final recycling stage.
            </p>

        </div>


        <!-- MESSAGE -->

        <div
            class="message"
            id="message">
        </div>


        <!-- STATISTICS -->

        <div class="stats">


            <div class="stat-card">

                <span>
                    Device
                </span>

                <h2 id="deviceCount">
                    0
                </h2>

            </div>


            <div class="stat-card">

                <span>
                    Current Status
                </span>

                <h2 id="currentStatus">
                    -
                </h2>

            </div>


            <div class="stat-card">

                <span>
                    Green Points
                </span>

                <h2 id="points">
                    0
                </h2>

            </div>


        </div>


        <!-- DEVICE AREA -->

        <div id="deviceArea">
        </div>


    </main>


    <script>


        /*
        =====================================
        GET DEVICE
        =====================================
        */

        let device =
            JSON.parse(
                localStorage.getItem("ewasteDevice")
            );


        /*
        =====================================
        NO DEVICE
        =====================================
        */

        if (!device) {

            document.getElementById(
                "deviceArea"
            ).innerHTML = `

                <div class="empty">

                    <h2>
                        No Device Available
                    </h2>

                    <p>
                        Register an e-waste device first.
                    </p>

                    <a href="register.html">
                        Register Device
                    </a>

                </div>

            `;

        }

        else {

            showRecycler();

        }


        /*
        =====================================
        SHOW RECYCLER PAGE
        =====================================
        */

        function showRecycler() {


            document.getElementById(
                "deviceCount"
            ).textContent = "1";


            document.getElementById(
                "currentStatus"
            ).textContent =
                device.status;


            document.getElementById(
                "points"
            ).textContent =
                device.reward || 0;



            document.getElementById(
                "deviceArea"
            ).innerHTML = `

                <div class="device-card">


                    <div class="device-header">

                        <div>

                            <h2>
                                ${device.brand}
                                ${device.model}
                            </h2>

                            <p class="tracking-id">

                                Tracking ID:
                                ${device.id}

                            </p>

                        </div>


                        <div class="status">

                            ♻️ ${device.status}

                        </div>

                    </div>



                    <!-- DEVICE INFORMATION -->

                    <div class="info-grid">


                        <div class="info-box">

                            <span>
                                Device Type
                            </span>

                            <strong>
                                ${device.type || "-"}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Brand
                            </span>

                            <strong>
                                ${device.brand || "-"}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Model
                            </span>

                            <strong>
                                ${device.model || "-"}
                            </strong>

                        </div>


                        <div class="info-box">

                            <span>
                                Weight
                            </span>

                            <strong>
                                ${device.weight || 0} kg
                            </strong>

                        </div>


                    </div>



                    <!-- PROCESS -->

                    <h2 class="process-title">
                        Recycling Process
                    </h2>


                    <div class="process-box">


                        <div
                            class="process-step"
                            id="stepRecycler">

                            <div class="step-circle">
                                1
                            </div>

                            <div class="step-text">

                                <strong>
                                    Certified Recycler
                                </strong>

                                <span>
                                    Device received by certified recycler.
                                </span>

                            </div>

                        </div>



                        <div
                            class="process-step"
                            id="stepProcessing">

                            <div class="step-circle">
                                2
                            </div>

                            <div class="step-text">

                                <strong>
                                    Processing
                                </strong>

                                <span>
                                    Device is dismantled and materials are separated.
                                </span>

                            </div>

                        </div>



                        <div
                            class="process-step"
                            id="stepRecycled">

                            <div class="step-circle">
                                3
                            </div>

                            <div class="step-text">

                                <strong>
                                    Recycling Completed
                                </strong>

                                <span>
                                    Materials have been recovered responsibly.
                                </span>

                            </div>

                        </div>


                    </div>



                    <!-- ACTIONS -->

                    <h3 style="margin-bottom:15px;">
                        Recycler Actions
                    </h3>


                    <div class="actions">


                        <button
                            class="processing-btn"
                            id="processingBtn"
                            onclick="startProcessing()">

                            ⚙️ Start Processing

                        </button>


                        <button
                            class="recycle-btn"
                            id="recycleBtn"
                            onclick="completeRecycling() {if (device.status !== "Processing") {
        showMessage(
            "The device must be in processing before recycling can be completed."
        );
        return;
    }

    device.status = "Recycled";

    const weight =
        parseFloat(device.weight) || 0;

    const reward =
        Math.max(
            100,
            Math.round(weight * 100)
        );

    device.reward = reward;

    saveDevice();

    showMessage(
        "♻️ Recycling completed! " +
        reward +
        " Green Points awarded."
    );
    }">

                            ♻️ Complete Recycling

                        </button>


                    </div>



                    <!-- REWARD -->

                    <div class="reward">

                        <div>

                            <h2>
                                🎁 Recycling Reward
                            </h2>

                            <p>
                                Points are released when recycling is completed.
                            </p>

                        </div>


                        <div
                            class="points"
                            id="rewardDisplay">

                            ${device.reward || 0} Points

                        </div>

                    </div>


                </div>

            `;


            updateProcess();

        }


        /*
        =====================================
        START PROCESSING
        =====================================
        */

        function startProcessing() {


            if (
                device.status !==
                "Certified Recycler"
            ) {

                showMessage(
                    "The device must first arrive at the certified recycler."
                );

                return;

            }


            device.status =
                "Processing";


            saveDevice();


            showMessage(
                "Device processing has started."
            );

        }


        /*
        =====================================
        COMPLETE RECYCLING
        =====================================
        */

        function completeRecycling() {


            if (
                device.status !==
                "Processing"
            ) {

                showMessage(
                    "The device must be in processing before recycling can be completed."
                );

                return;

            }


            device.status =
                "Recycled";


            /*
            Calculate reward
            */


            const weight =
                parseFloat(
                    device.weight
                ) || 0;


            /*
            Example:
            100 points per kg
            Minimum 100 points
            */


            const reward =
                Math.max(
                    100,
                    Math.round(weight * 100)
                );


            device.reward =
                reward;


            /*
            Save
            */


            saveDevice();


            showMessage(
                "♻️ Recycling completed! " +
                reward +
                " Green Points awarded."
            );

        }


        /*
        =====================================
        SAVE DEVICE
        =====================================
        */

        function saveDevice() {


            localStorage.setItem(
                "ewasteDevice",
                JSON.stringify(device)
            );


            showRecycler();

        }


        /*
        =====================================
        UPDATE PROCESS
        =====================================
        */

        function updateProcess() {


            const recycler =
                document.getElementById(
                    "stepRecycler"
                );


            const processing =
                document.getElementById(
                    "stepProcessing"
                );


            const recycled =
                document.getElementById(
                    "stepRecycled"
                );


            const processingBtn =
                document.getElementById(
                    "processingBtn"
                );


            const recycleBtn =
                document.getElementById(
                    "recycleBtn"
                );


            if (!recycler) return;


            /*
            CERTIFIED RECYCLER
            */

            if (
                device.status ===
                "Certified Recycler"
            ) {

                recycler.classList.add(
                    "step-complete"
                );

                processingBtn.disabled = false;

                recycleBtn.disabled = true;

            }


            /*
            PROCESSING
            */

            else if (
                device.status ===
                "Processing"
            ) {

                recycler.classList.add(
                    "step-complete"
                );

                processing.classList.add(
                    "step-current"
                );

                processingBtn.disabled = true;

                recycleBtn.disabled = false;

            }


            /*
            RECYCLED
            */

            else if (
                device.status ===
                "Recycled"
            ) {

                recycler.classList.add(
                    "step-complete"
                );

                processing.classList.add(
                    "step-complete"
                );

                recycled.classList.add(
                    "step-complete"
                );

                processingBtn.disabled = true;

                recycleBtn.disabled = true;

            }


            /*
            OTHER STATUS
            */

            else {

                processingBtn.disabled = true;

                recycleBtn.disabled = true;

            }

        }


        /*
        =====================================
        MESSAGE
        =====================================
        */

        function showMessage(text) {


            const message =
                document.getElementById(
                    "message"
                );


            message.textContent =
                text;


            message.style.display =
                "block";


            setTimeout(
                function () {

                    message.style.display =
                        "none";

                },
                3500
            );

        }

    </script>


</body>

</html>
